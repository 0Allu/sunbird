[package]
name              = "plumage-runtime"
description       = "QuickJS plugin runtime that drives plumage's gateway hooks"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
flub         = { workspace = true }
log          = { workspace = true }
plumage-hook = { workspace = true }
plumage-sigs = { workspace = true }
rquickjs     = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# rquickjs-sys ships pregenerated bindings for desktop triples only.
rquickjs = { features = [ "bindgen" ], workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni-sys    = { workspace = true }
libc       = { workspace = true }
plumage-ui = { workspace = true }

[lints]
workspace = true
