[package]
name              = "phoenix-runtime"
description       = "QuickJS plugin runtime that drives phoenix's gateway hooks"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
crc32fast    = { workspace = true }
flub         = { workspace = true }
log          = { workspace = true }
memchr       = { workspace = true }
phoenix-hook = { workspace = true }
phoenix-sigs = { workspace = true }
rquickjs     = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# rquickjs-sys ships pregenerated bindings for desktop triples only.
rquickjs = { features = [ "bindgen" ], workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni-sys           = { workspace = true }
libc              = { workspace = true }
patcher           = { workspace = true }
phoenix-ui-mobile = { workspace = true }
phoenix-wire      = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
phoenix-ui-desktop = { workspace = true }
rusqlite           = { workspace = true }

[lints]
workspace = true
