name: pages
on:
  push:
    branches: [main]
    paths: ['web/**', 'plugins/**', 'crates/**', 'Cargo.*', 'flake.*', 'nix/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command nu scripts/site.nu web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The plugins stay TypeScript in plugins/*/src; the site serves them bundled.
      - run: npm install --no-save --no-package-lock esbuild@0.25.12
      - run: node web/tools/bundle-plugins.mjs
        env:
          ESBUILD: node_modules/.bin/esbuild
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
