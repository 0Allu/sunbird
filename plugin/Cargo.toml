# libplg.so: Phoenix plugin host. loader (cdylib) -> runtime (rquickjs) -> hook (+ sigs).
[workspace]
members = ["sigs", "hook", "runtime", "loader"]
resolver = "2"

# rquickjs-sys ships no Android bindings; this trimmed copy maps the linux-gnu ones (same ABI per arch).
[patch.crates-io]
rquickjs-sys = { path = "rquickjs-sys" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
