[workspace]
members  = [
  "crates/hook",
  "crates/loader",
  "crates/runtime",
  "crates/sigs",
  "crates/sigscan",
  "crates/stand-in",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
android_logger  = { default-features = false, version = "0.15" }
bindgen         = "0.73"
cc              = "1"
color-eyre      = { default-features = false, version = "0.6" }
dobby-rs        = "0.1"
eyre            = "0.6"
libc            = "0.2"
log             = "0.4"
memchr          = "2"
object          = { default-features = false, features = [ "elf", "read_core", "std" ], version = "0.41" }
plumage-hook    = { path = "crates/hook" }
plumage-runtime = { path = "crates/runtime" }
plumage-sigs    = { path = "crates/sigs" }
rquickjs        = { features = [ "parallel" ], version = "0.14" }
serde           = { features = [ "derive" ], version = "1" }
serde_json      = { features = [ "raw_value" ], version = "1" }
thiserror       = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto           = "fat"
panic         = "unwind"
strip         = true
